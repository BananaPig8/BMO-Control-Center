<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Gato-Cam</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #000;
  }
  #memeImg {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }
  .cam-pip {
    position: absolute;
    right: 14px;
    bottom: 14px;
    width: 30vw;
    max-width: 220px;
    aspect-ratio: 4 / 3;
    border-radius: 14px;
    overflow: hidden;
    border: 2px solid rgba(255, 255, 255, 0.35);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
    background: #111;
    z-index: 3;
  }
  #video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    display: block;
  }
  #debugHud {
    /* Reactivado temporalmente 2026-08-19 para ajustar el umbral de
       "devo cat" (twoHandsOnHead) - volver a poner display:none cuando
       se termine de calibrar. */
    position: absolute;
    bottom: 4px;
    left: 6px;
    color: #7cffa0;
    font: 10px/1.3 monospace;
    white-space: pre;
    text-shadow: 0 0 3px #000, 0 0 3px #000;
    pointer-events: none;
  }
  #camStatus {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px;
    text-align: center;
    color: #ccc;
    font: 12px/1.4 system-ui, sans-serif;
    background: #111;
  }
  #camStatus[hidden] { display: none; }
</style>
</head>
<body>
  <div class="stage">
    <img id="memeImg" src="memes/pokercat.jpg" alt="" />
    <div class="cam-pip">
      <video id="video" playsinline muted autoplay></video>
      <div id="debugHud"></div>
      <div id="camStatus">Activando cámara…</div>
    </div>
  </div>

  <script type="module">
    // Cache-buster en la propia importacion: evita que el navegador sirva
    // una copia vieja de app.js mientras se ajustan los umbrales de
    // deteccion de gestos en vivo (2026-08-19).
    import("./app.js?t=" + Date.now());
  </script>
</body>
</html>
